<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin Dashboard - Mbali's Closet</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #ffe6f0;
    margin: 0;
    padding: 20px;
    color: #333;
  }

  h1 {
    text-align: center;
    margin-bottom: 20px;
  }

  /* Product table styles */
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
  }

  th, td {
    border: 1px solid #ccc;
    padding: 8px;
    text-align: center;
  }

  th {
    background-color: #f4a6b7;
  }

  /* Buttons style */
  button {
    background: linear-gradient(135deg, #ffb6c1, #ff69b4);
    color: #fff;
    border: none;
    padding: 8px 12px;
    border-radius: 20px;
    cursor: pointer;
    margin: 2px;
    font-weight: bold;
  }

  button:hover {
    background: linear-gradient(135deg, #ff69b4, #ff1493);
  }

  /* Input styles */
  input[type="text"], input[type="number"], input[type="file"] {
    width: 100%;
    padding: 8px;
    margin-top: 8px;
    border-radius: 4px;
    border: 1px solid #ccc;
  }

  /* Layout */
  .section {
    max-width: 1000px;
    margin: 20px auto;
  }
</style>
</head>
<body>

<h1>Admin Dashboard - Mbali's Closet</h1>

<!-- Product Management -->
<div class="section">
  <h2>Add New Product</h2>
  <form id="addProductForm">
    <input type="text" id="productName" placeholder="Product Name" required />
    <input type="number" id="productPrice" placeholder="Price" required />
    <input type="file" id="productImage" accept="image/*" required />
    <button type="submit">Add Product</button>
  </form>
</div>

<!-- Product List -->
<div class="section">
  <h2>Manage Products</h2>
  <table id="productTable">
    <thead>
      <tr>
        <th>Image</th>
        <th>Name</th>
        <th>Price</th>
        <th>Delete</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<!-- Customer Orders -->
<div class="section">
  <h2>Customer Orders</h2>
  <table id="ordersTable">
    <thead>
      <tr>
        <th>Name</th>
        <th>Phone</th>
        <th>Items</th>
        <th>Delete Order</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
  // Password protection
  const adminPassword = "mypassword"; // Change this password!
  const inputPass = prompt("Enter admin password:");
  if (inputPass !== adminPassword) {
    alert("Incorrect password! Redirecting...");
    window.location.href = "../index.html"; // redirect to main site
  }

  // Load existing products and orders
  let products = JSON.parse(localStorage.getItem('products')) || [];
  let orders = JSON.parse(localStorage.getItem('orders')) || [];

  const productTableBody = document.querySelector('#productTable tbody');
  const ordersTableBody = document.querySelector('#ordersTable tbody');

  // Function to display products
  function loadProducts() {
    productTableBody.innerHTML = '';
    products.forEach((prod, index) => {
      const row = document.createElement('tr');

      // Image cell
      const imgTd = document.createElement('td');
      const img = document.createElement('img');
      img.src = prod.image;
      img.width = 80;
      imgTd.appendChild(img);
      row.appendChild(imgTd);

      // Name
      const nameTd = document.createElement('td');
      nameTd.innerText = prod.name;
      row.appendChild(nameTd);

      // Price
      const priceTd = document.createElement('td');
      priceTd.innerText = `$${prod.price}`;
      row.appendChild(priceTd);

      // Delete button
      const delTd = document.createElement('td');
      const delBtn = document.createElement('button');
      delBtn.innerText = 'Delete';
      delBtn.onclick = () => {
        products.splice(index, 1);
        localStorage.setItem('products', JSON.stringify(products));
        loadProducts();
      };
      delTd.appendChild(delBtn);
      row.appendChild(delTd);

      productTableBody.appendChild(row);
    });
  }

  // Function to display orders
  function loadOrders() {
    ordersTableBody.innerHTML = '';
    orders.forEach((order, index) => {
      const row = document.createElement('tr');

      // Name
      const nameTd = document.createElement('td');
      nameTd.innerText = order.name;
      row.appendChild(nameTd);

      // Phone
      const phoneTd = document.createElement('td');
      phoneTd.innerText = order.phone;
      row.appendChild(phoneTd);

      // Items
      const itemsTd = document.createElement('td');
      itemsTd.innerText = order.items.map(i => i.name).join(', ');
      row.appendChild(itemsTd);

      // Delete order
      const delTd = document.createElement('td');
      const delBtn = document.createElement('button');
      delBtn.innerText = 'Delete';
      delBtn.onclick = () => {
        orders.splice(index, 1);
        localStorage.setItem('orders', JSON.stringify(orders));
        loadOrders();
      };
      delTd.appendChild(delBtn);
      row.appendChild(delTd);

      ordersTableBody.appendChild(row);
    });
  }

  // Handle adding new product
  document.getElementById('addProductForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const name = document.getElementById('productName').value;
    const price = parseFloat(document.getElementById('productPrice').value);
    const fileInput = document.getElementById('productImage');
    const file = fileInput.files[0];

    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const imageDataUrl = e.target.result;
        products.push({ name, price, image: imageDataUrl });
        localStorage.setItem('products', JSON.stringify(products));
        loadProducts();
        document.getElementById('addProductForm').reset();
      };
      reader.readAsDataURL(file);
    } else {
      alert('Please select an image.');
    }
  });

  // Initialize display
  loadProducts();
  loadOrders();
</script>
</body>
</html>
